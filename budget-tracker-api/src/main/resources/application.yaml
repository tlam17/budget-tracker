spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/private_key.pem}
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/public_key.pem}
  issuer: ${JWT_ISSUER:budget-tracker-api}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes in ms
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000} # 30 days in ms